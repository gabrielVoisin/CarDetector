# Run a simulated cabinet on a laptop against the local stack (docker compose up):
#   python -m agent -c config.simulator.yaml -v
# Cars: curl -X POST localhost:8090/simulate/bay/EXT/05 -d '{"occupied": true}'
server_url: http://localhost:8000
controller_key: ctrl0001.demo-secret-change-me-1
data_dir: ./.agent-data
io_backend: network
debounce_s: 2
detectors:
  listen: 127.0.0.1:8090
  timeout_s: 0               # simulated detectors never go silent
  simulate_traffic: false    # true = random arrivals and departures
ble:
  enabled: false             # a laptop usually has no BlueZ peripheral support; see config.prototype.yaml
